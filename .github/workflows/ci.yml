name: CI
on:
  pull_request:
  push:
    branches: [main]

# Read-only token for every job. (No job uses pull_request_target: pull requests from forks never get secrets.)
permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Validate quiz banks + glossary (predict-output answers checked against tclsh)
        run: |
          sudo apt-get update && sudo apt-get install -y tcl8.6
          TCLSH=tclsh8.6 npm run validate
      - name: Build (includes content schema + internal link validation)
        run: npm run build

  tcl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tcl: ['8.6', '9.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Tcl ${{ matrix.tcl }}
        run: |
          if [ "${{ matrix.tcl }}" = "8.6" ]; then
            sudo apt-get update && sudo apt-get install -y tcl8.6 tcllib
            echo "TCLSH=tclsh8.6" >> "$GITHUB_ENV"
          else
            sudo apt-get update && sudo apt-get install -y tcl9.0 || {
              echo "tcl9.0 not available from apt; building from source"
              curl -fsSL https://prdownloads.sourceforge.net/tcl/tcl9.0.1-src.tar.gz | tar xz
              (cd tcl9.0.1/unix && ./configure --prefix=/usr/local && make -j"$(nproc)" && sudo make install)
              echo "TCLSH=/usr/local/bin/tclsh9.0" >> "$GITHUB_ENV"
            }
            [ -n "$TCLSH" ] || echo "TCLSH=tclsh9.0" >> "$GITHUB_ENV"
          fi
      - name: Report Tcl version
        run: echo 'puts [info patchlevel]' | $TCLSH
      - name: Validate quizzes with this Tcl version
        run: TCLSH=$TCLSH npm run validate
      - name: Extract snippets
        run: npm run snippets:extract
      - name: Snippet tests (stdout compared exactly)
        run: $TCLSH scripts/run-snippets.tcl
      # The browser "Check" button and its self-test run as snippets above (lab__* pages). This step
      # checks the terminal wrapper too: on the untouched starter it must print a RESULT line.
      - name: Lab checkers (terminal wrapper on each starter)
        run: |
          for t in labs/*/*/tests/test.tcl; do
            [ -e "$t" ] || continue
            out="$($TCLSH "$t" || true)"
            echo "$out" | tail -1
            echo "$out" | grep -Eq '^RESULT: (PASS|FAIL) [0-9]+/[0-9]+$' || { echo "::error::$t printed no RESULT line"; exit 1; }
          done
      # DRV-Lite tests start working when the engine lands (P5); they skip until then.
      - name: DRV-Lite tests
        run: |
          if ls drvlite/tests/*.test >/dev/null 2>&1; then
            for t in drvlite/tests/*.test; do $TCLSH "$t"; done
          else echo "::notice::DRV-Lite tests not yet added (P5)"; fi
      # Lab, capstone and exam tests against the private reference solutions run in the job "solutions" below.

  wacl:
    # Runs every snippet marked runs_in=playground in the real browser engine (Wacl, Tcl 8.6.6),
    # so code that passes on tclsh 8.6.17 / 9.0 but fails in the browser is caught.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Snippets in Wacl (headless Chrome)
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          npm run snippets:wacl
      - name: Build the site for the browser test
        run: npm run build
      - name: Playground guards in the built site (output limit, restart after out of memory)
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          npm run test:browser

  solutions:
    # Tests the M10 capstone grader and exam against the PRIVATE reference solutions
    # (Capeur/SJTU-VLSI-TCL-Language-solutions; decision log, P3 Week 10). Needs the repository secret
    # SOLUTIONS_DEPLOY_KEY: the private half of a READ-ONLY deploy key of that repository. Without it (before
    # setup, or on a pull request from a fork, which never gets secrets) the job is skipped with a warning
    # and still succeeds.
    # Safety rules (user review, P3 Week 10):
    #   - read-only token; only official actions, pinned to a full commit SHA; no npm cache, no artifacts;
    #   - everything that installs or runs third-party code (npm ci, the site build) happens BEFORE the key is
    #     used; the key is used in ONE step only, the official checkout action, which deletes it at the end of
    #     that step (persist-credentials: false);
    #   - CI logs of this public repository are public, so the tools print only check names and ok/FAIL, and
    #     every step also filters its output to those lines: no solution, answer or expected line can reach the log.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        tcl: ['8.6', '9.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      # The secret's value is only tested for being empty, with shell builtins; it is not passed on.
      - name: Is the solutions key set?
        id: key
        env:
          SOLUTIONS_DEPLOY_KEY: ${{ secrets.SOLUTIONS_DEPLOY_KEY }}
        run: |
          if [ -z "$SOLUTIONS_DEPLOY_KEY" ]; then
            echo "::warning title=Private solutions not checked::SOLUTIONS_DEPLOY_KEY is not set (or this is a pull request from a fork), so the capstone grader and the exam were NOT tested against the private reference solutions."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      # 1. Third-party code: installs and the build, before the key is used and before solutions/ exists.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        if: steps.key.outputs.available == 'true'
        with:
          node-version: 22
      - name: Install dependencies
        if: steps.key.outputs.available == 'true'
        run: npm ci
      - name: Install Tcl ${{ matrix.tcl }}
        if: steps.key.outputs.available == 'true'
        run: |
          if [ "${{ matrix.tcl }}" = "8.6" ]; then
            sudo apt-get update && sudo apt-get install -y tcl8.6
            echo "TCLSH=tclsh8.6" >> "$GITHUB_ENV"
          else
            sudo apt-get update && sudo apt-get install -y tcl9.0 || {
              echo "tcl9.0 not available from apt; building from source"
              curl -fsSL https://prdownloads.sourceforge.net/tcl/tcl9.0.1-src.tar.gz | tar xz
              (cd tcl9.0.1/unix && ./configure --prefix=/usr/local && make -j"$(nproc)" && sudo make install)
              echo "TCLSH=/usr/local/bin/tclsh9.0" >> "$GITHUB_ENV"
            }
            [ -n "$TCLSH" ] || echo "TCLSH=tclsh9.0" >> "$GITHUB_ENV"
          fi
      - name: Build the site (for the browser check)
        if: steps.key.outputs.available == 'true' && matrix.tcl == '8.6'
        run: npm run build > /dev/null
      # 2. The only step that sees the key.
      - name: Check out the private solutions
        if: steps.key.outputs.available == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: Capeur/SJTU-VLSI-TCL-Language-solutions
          ssh-key: ${{ secrets.SOLUTIONS_DEPLOY_KEY }}
          path: solutions
          persist-credentials: false
      # 3. The checks. No install, no build, no key from here on.
      - name: Capstone data files match the reference solution
        if: steps.key.outputs.available == 'true'
        run: |
          set -o pipefail
          $TCLSH solutions/tools/make-capstone-data.tcl . check 2>&1 | grep -E '^(ok  |FAIL) '
      - name: Capstone grader against the reference solution and mutants
        if: steps.key.outputs.available == 'true'
        run: |
          set -o pipefail
          $TCLSH solutions/tools/check-capstone.tcl . 2>&1 | grep -E '^(ok  |FAIL|check-capstone:) '
      - name: Exam reference answers
        if: steps.key.outputs.available == 'true'
        run: |
          set -o pipefail
          TCLSH=$TCLSH node solutions/tools/check-exam-answers.mjs 2>&1 | grep -E '^(ok  |FAIL|check-exam-answers:) '
      - name: Exam and capstone in the built site (Wacl, headless Chrome)
        if: steps.key.outputs.available == 'true' && matrix.tcl == '8.6'
        run: |
          set -o pipefail
          export CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          node solutions/tools/check-browser.mjs 2>&1 | grep -E '^(ok  |FAIL|check-browser:) '
