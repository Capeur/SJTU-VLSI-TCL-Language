name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Validate quiz banks + glossary (predict-output answers checked against tclsh)
        run: |
          sudo apt-get update && sudo apt-get install -y tcl8.6
          TCLSH=tclsh8.6 npm run validate
      - name: Build (includes content schema + internal link validation)
        run: npm run build

  tcl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tcl: ['8.6', '9.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Tcl ${{ matrix.tcl }}
        run: |
          if [ "${{ matrix.tcl }}" = "8.6" ]; then
            sudo apt-get update && sudo apt-get install -y tcl8.6 tcllib
            echo "TCLSH=tclsh8.6" >> "$GITHUB_ENV"
          else
            sudo apt-get update && sudo apt-get install -y tcl9.0 || {
              echo "tcl9.0 not available from apt; building from source"
              curl -fsSL https://prdownloads.sourceforge.net/tcl/tcl9.0.1-src.tar.gz | tar xz
              (cd tcl9.0.1/unix && ./configure --prefix=/usr/local && make -j"$(nproc)" && sudo make install)
              echo "TCLSH=/usr/local/bin/tclsh9.0" >> "$GITHUB_ENV"
            }
            [ -n "$TCLSH" ] || echo "TCLSH=tclsh9.0" >> "$GITHUB_ENV"
          fi
      - name: Report Tcl version
        run: echo 'puts [info patchlevel]' | $TCLSH
      - name: Validate quizzes with this Tcl version
        run: TCLSH=$TCLSH npm run validate
      - name: Extract snippets
        run: npm run snippets:extract
      - name: Snippet tests (stdout compared exactly)
        run: $TCLSH scripts/run-snippets.tcl
      # The browser "Check" button and its self-test run as snippets above (lab__* pages). This step
      # checks the terminal wrapper too: on the untouched starter it must print a RESULT line.
      - name: Lab checkers (terminal wrapper on each starter)
        run: |
          for t in labs/*/*/tests/test.tcl; do
            [ -e "$t" ] || continue
            out="$($TCLSH "$t" || true)"
            echo "$out" | tail -1
            echo "$out" | grep -Eq '^RESULT: (PASS|FAIL) [0-9]+/[0-9]+$' || { echo "::error::$t printed no RESULT line"; exit 1; }
          done
      # DRV-Lite tests start working when the engine lands (P5); they skip until then.
      - name: DRV-Lite tests
        run: |
          if ls drvlite/tests/*.test >/dev/null 2>&1; then
            for t in drvlite/tests/*.test; do $TCLSH "$t"; done
          else echo "::notice::DRV-Lite tests not yet added (P5)"; fi
      - name: Lab tests against private reference solutions
        run: echo "::warning::private solutions repository not available; lab tests skipped"

  wacl:
    # Runs every snippet marked runs_in=playground in the real browser engine (Wacl, Tcl 8.6.6),
    # so code that passes on tclsh 8.6.17 / 9.0 but fails in the browser is caught.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Snippets in Wacl (headless Chrome)
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          npm run snippets:wacl
      - name: Build the site for the browser test
        run: npm run build
      - name: Playground guards in the built site (output limit, restart after out of memory)
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          npm run test:browser
