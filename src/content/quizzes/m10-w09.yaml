  - id: m10-w09-q25
    type: mcq
    lesson: b
    tags: [array-order]
    review: true
    prompt: "Your script prints the layers with  foreach layer [array names count].  On your computer they come out in the order you want. Is the script right?"
    choices:
      - 'No: that order is not promised and may be different with another Tcl version'
      - 'Yes: if it works once, it always works'
      - 'Yes: array names always gives insertion order'
      - 'No: array names gives the values, not the keys'
    answer: 'No: that order is not promised and may be different with another Tcl version'
    explanation: >
      An order that is not promised can change between Tcl versions, or when the array grows. Sort with
      lsort, or walk a dict that holds the order you want.
    distractor_feedback:
      'Yes: if it works once, it always works': 'A lucky order is still luck. Another Tcl, or one more element, can change it.'
      'Yes: array names always gives insertion order': 'That is what a dict does. Arrays keep no order.'
      'No: array names gives the values, not the keys': 'array names does give the keys. The problem is their order.'

  - id: m10-w09-q26
    type: predict-output
    lesson: b
    tags: [array, dict, lsort]
    review: false
    prompt: "From a dict to an array. What does this print?"
    code: |
      set table [dict create TEXT 63.0 ACTIVE 1.0 VIA1 5.0]
      dict for {name number} $table {
