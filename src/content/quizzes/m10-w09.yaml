  - id: m10-w09-q27
    type: order-steps
    lesson: b
    tags: [array, incr]
    review: false
    prompt: 'count does not exist yet. Put in order what happens in:   foreach layer {POLY POLY} {incr count($layer)}'
    steps:
      - "layer is POLY: incr finds no element count(POLY), so it starts it at 0 and adds 1"
      - "layer is POLY again: incr adds 1 to the existing element, which is now 2"
      - "The loop ends: count has one element, count(POLY), holding 2"
    explanation: >
      incr creates a missing element at 0 before adding, so counting needs no setup.

  - id: m10-w09-q28
    type: mcq
    lesson: b
    tags: [array, error]
    review: false
    prompt: 'set count(METAL1) 12  then  puts $count(Metal1).  What happens?'
    choices:
      - 'An error: no such element in array'
      - 'It prints 12'
      - 'It prints an empty line'
      - 'It prints 0'
    answer: 'An error: no such element in array'
    explanation: >
      Metal1 and METAL1 are different keys. Reading an element that was never set stops the script:
      can't read "count(Metal1)": no such element in array.
    distractor_feedback:
      'It prints 12': 'Keys are exact, and capitals count. Metal1 is not METAL1.'
      'It prints an empty line': 'Reading a missing element is an error, not an empty value.'
      'It prints 0': 'Only incr starts a missing element at 0. Reading it is an error.'
