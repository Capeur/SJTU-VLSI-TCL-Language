  - id: m10-w09-q20
    type: multi-select
    lesson: b
    tags: [array-order, lsort]
    review: true
    prompt: "A report must list the counts in the same order every time. Which loops give a fixed order? Pick all that apply."
    choices:
      - 'foreach layer [lsort [array names count]] {…}'
      - 'dict for {name gds} $layerTable {…}'
      - 'foreach layer [array names count] {…}'
      - 'foreach {layer n} [array get count] {…}'
    answer:
      - 'foreach layer [lsort [array names count]] {…}'
      - 'dict for {name gds} $layerTable {…}'
    explanation: >
      lsort gives a fixed, sorted order, and a dict keeps insertion order. array names and array get both
      give the elements in an order that is not promised.

  - id: m10-w09-q21
    type: predict-output
    lesson: b
    tags: [array, upvar]
    review: false
    prompt: "An array passed by its name. What does this print?"
    code: |
      proc addShape {arrayName layer} {
          upvar 1 $arrayName counts
          incr counts($layer)
      }
      addShape shapes POLY
      addShape shapes POLY
      addShape shapes CONTACT
      puts "POLY: $shapes(POLY), CONTACT: $shapes(CONTACT)"
    answer: "POLY: 2, CONTACT: 1"
    explanation: >
      The proc gets the NAME shapes. upvar links counts to the caller's array, so incr changes the caller's
      elements directly.

  - id: m10-w09-q22
    type: mcq
    lesson: b
    tags: [dict-or-array]
    review: true
    prompt: "Which task suits an array better than a dict?"
    choices:
      - 'Counting shapes per layer while reading a layout, one incr at a time'
      - 'A table that a proc returns'
      - 'A record inside a record'
      - 'A report that must keep the order of a table'
    answer: 'Counting shapes per layer while reading a layout, one incr at a time'
    explanation: >
      incr count($layer) changes one counter in place, simply. The other three need a value that can be
      returned, nested or kept in order: a dict.
    distractor_feedback:
      'A table that a proc returns': 'An array cannot be returned: it is not a value. Return a dict.'
      'A record inside a record': 'Arrays have one level only. Nested records need a dict.'
      'A report that must keep the order of a table': 'array names keeps no order. A dict keeps insertion order.'

