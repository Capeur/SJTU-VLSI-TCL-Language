# Week 9 — Tables of data. Lesson A: dict create / get / set / exists / keys / size, dict for in insertion
# order (a key set again keeps its place; a new key goes at the end), nested records, the teaching GDS
# numbers (layer.datatype, datatype 0 = drawing). Lesson B: arrays (set a(key), $a(key), incr a($k)),
# array size / names, THE ORDER TRAP (array names promises no order), dict or array, passing an array by name.
# Tags used by the exit quizzes: "order" (Lesson A, require="order"), "array-order" (Lesson B, require="array-order").
# THE ORDER RULE (user decision): no answer here depends on the order of array names. Every predict-output item
# that lists an array sorts it with lsort, or reads single elements; the order items are mcq / multi-select.
# GDS numbers come from src/styles/layers.ts (check-chip checks them). The lab's shapes are not used (rule 21).
# Every predict-output answer is checked against real tclsh 8.6 and 9.0 by scripts/validate-quizzes.mjs.
ai_assisted: true
reviewed_by: "David"
review_date: "2026-10-16"
questions:
  # ---------- Lesson A ----------
  - id: m10-w09-q01
    type: predict-output
    lesson: a
    tags: [order, dict-for, dict-set]
    review: true
    prompt: "One key is set twice. What does this print?"
    code: |
      set counts [dict create METAL1 12 POLY 5]
      dict set counts VIA1 7
      dict set counts METAL1 13
      dict for {layer n} $counts {
          puts "$layer $n"
      }
    answer: |-
      METAL1 13
      POLY 5
      VIA1 7
    explanation: >
      dict for walks the keys in insertion order. VIA1 is new, so it goes at the end. Setting METAL1 again
      changes its value to 13 but keeps its place: first.

  - id: m10-w09-q02
    type: predict-output
    lesson: a
    tags: [nested-dict, dict-exists]
    review: true
    prompt: "A record inside a dict. What does this print?"
    code: |
      set layers [dict create]
      dict set layers POLY number 2
      dict set layers POLY datatype 0
      puts [dict get $layers POLY]
      puts [dict exists $layers METAL1]
    answer: |-
      number 2 datatype 0
      0
    explanation: >
      With two keys, dict set fills the field of a record: the record POLY gets number 2, then datatype 0.
      dict get with one key gives the whole record. METAL1 was never added, so dict exists gives 0.

  - id: m10-w09-q03
    type: predict-output
    lesson: a
    tags: [dict-get, dict-keys]
    review: true
    prompt: "What does this print?"
    code: |
      set gdsNumbers [dict create ACTIVE 1.0 CONTACT 3.0]
      dict set gdsNumbers VIA1 5.0
      puts [dict get $gdsNumbers CONTACT]
      puts [dict keys $gdsNumbers]
      puts [dict size $gdsNumbers]
    answer: |-
      3.0
      ACTIVE CONTACT VIA1
      3
    explanation: >
      dict get looks up the value of CONTACT. dict keys gives the keys in insertion order, with the new key
      VIA1 at the end. There are three pairs.

  - id: m10-w09-q04
    type: mcq
    lesson: a
    tags: [order, dict-for]
    review: true
    prompt: "In which order does  dict for  walk the pairs of a dict?"
    choices:
      - 'The order in which the keys were first added'
      - 'Alphabetical order of the keys'
      - 'An order that Tcl does not promise'
      - 'From the largest value to the smallest'
    answer: 'The order in which the keys were first added'
    explanation: >
      A dict keeps insertion order. That is why a dict is a good choice for a report that must follow the
      order of a table.
    distractor_feedback:
      'Alphabetical order of the keys': 'A dict does not sort its keys. For alphabetical order, use lsort on the keys.'
      'An order that Tcl does not promise': 'That is true for array names, not for a dict. A dict keeps insertion order.'
      'From the largest value to the smallest': 'dict for never looks at the values to choose an order.'

  - id: m10-w09-q05
    type: find-the-bug
    lesson: a
    tags: [dict-get, capitals]
    review: true
    prompt: 'This stops with  key "metal2" not known in dictionary.  Which line has the bug?'
    code: |
      set gdsNumbers [dict create METAL1 4.0 METAL2 6.0]
      set typed metal2
      puts [dict get $gdsNumbers $typed]
    answer: 3
    explanation: >
      Keys are exact, and capitals count: metal2 is not METAL2. Clean the name with string toupper, or test
      with dict exists before dict get.

  - id: m10-w09-q06
    type: predict-output
    lesson: a
    tags: [dict-set, name]
    review: true
    prompt: "Look closely at the second line. What does this print?"
    code: |
      set gdsNumbers [dict create POLY 2.0]
      dict set $gdsNumbers TEXT 63.0
      puts $gdsNumbers
    answer: "POLY 2.0"
    explanation: >
      dict set wants the variable's NAME. With $, Tcl replaces $gdsNumbers with its value first, so dict set
      fills a new variable with the strange name "POLY 2.0". gdsNumbers itself never changes.

  - id: m10-w09-q07
    type: mcq
    lesson: a
    tags: [datatype, gds]
    review: true
    prompt: "In this course, METAL1 is GDS 4.0. What do the two numbers mean?"
    choices:
      - 'Layer 4, datatype 0'
      - 'Layer 4, 0 shapes'
      - 'Version 4.0 of the layer'
      - 'The layer is 4.0 µm thick'
    answer: 'Layer 4, datatype 0'
    explanation: >
      A GDS file stores two numbers per shape: the layer and the datatype. In this course, datatype 0 means
      drawing for every layer. These are teaching numbers, not any factory's.
    distractor_feedback:
      'Layer 4, 0 shapes': 'The number pair says where a shape is drawn, not how many shapes there are.'
      'Version 4.0 of the layer': 'It looks like a version number, but it is two numbers: layer and datatype.'
      'The layer is 4.0 µm thick': 'GDS stores flat shapes. Thickness is not part of the layer number.'

  - id: m10-w09-q08
    type: predict-output
    lesson: a
    tags: [nested-dict, dict-get]
    review: false
    prompt: "What does this print?"
    code: |
      set layers [dict create]
      dict set layers VIA1 number 5
      dict set layers VIA1 purpose drawing
      dict set layers TEXT number 63
      puts [dict get $layers TEXT number]
      puts [dict get $layers VIA1 purpose]
      puts [dict keys $layers]
    answer: |-
      63
      drawing
      VIA1 TEXT
    explanation: >
      With two keys, dict get goes in through the record, then the field. The outer keys are the records,
      in insertion order: VIA1, then TEXT.

  - id: m10-w09-q09
    type: fill-blank
    lesson: a
    tags: [dict-exists]
    review: true
    prompt: 'Fill the blank so that the test gives 1 or 0 without ever stopping with an error:     if {[dict ___ $gdsNumbers $name]} {…}'
    answer: ['exists']
    explanation: >
      dict exists answers 1 or 0. dict get would stop with an error when the key is missing.

  - id: m10-w09-q10
    type: mcq
    lesson: a
    tags: [dict-for, error]
    review: false
    prompt: 'dict for {name} $gdsNumbers {puts $name}  stops with an error. Why?'
    choices:
      - 'dict for needs two variable names, one for the key and one for the value'
      - 'name is not allowed as a variable name'
      - 'gdsNumbers should be written without $'
      - 'The body must use both variables'
    answer: 'dict for needs two variable names, one for the key and one for the value'
    explanation: >
      Tcl says: must have exactly two variable names. Write dict for {name gds} $gdsNumbers {…}, even if the
      body uses only one of them.
    distractor_feedback:
      'name is not allowed as a variable name': 'name is a fine variable name. The problem is that there is only one.'
      'gdsNumbers should be written without $': 'dict for reads the dict, so it takes the VALUE, with $. Only dict set needs the name.'
      'The body must use both variables': 'The body may use just one. But dict for must be given two names.'

  - id: m10-w09-q11
    type: predict-output
    lesson: a
    tags: [order, dict-set]
    review: false
    prompt: "What does this print?"
    code: |
      set gdsNumbers [dict create METAL2 6.0]
      dict set gdsNumbers ACTIVE 1.0
      dict set gdsNumbers METAL2 6.0
      dict set gdsNumbers POLY 2.0
      puts [dict keys $gdsNumbers]
    answer: "METAL2 ACTIVE POLY"
    explanation: >
      METAL2 was added first. Setting it again does not move it. ACTIVE and POLY are new, so each goes at
