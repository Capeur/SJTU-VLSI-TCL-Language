  - id: m10-w09-q12
    type: multi-select
    lesson: a
    tags: [dict-set, name]
    review: true
    prompt: "Which commands take the variable's NAME, without $, because they change the variable? Pick all that apply."
    choices: ['dict set gdsNumbers VIA1 5.0', 'incr count', 'lappend names CORE', 'dict get $gdsNumbers VIA1', 'dict keys $gdsNumbers']
    answer: ['dict set gdsNumbers VIA1 5.0', 'incr count', 'lappend names CORE']
    explanation: >
      dict set, incr and lappend change a variable, so they need its name. dict get and dict keys only
      read a value, so they take it with $.

  - id: m10-w09-q13
    type: order-steps
    lesson: a
    tags: [nested-dict, dict-get]
    review: false
    prompt: 'layers holds the record {number 6 datatype 0 purpose drawing} for METAL2. Put in order what happens in:   puts [dict get $layers METAL2 number]'
    steps:
      - "Replace $layers with its value, the whole table"
      - "dict get finds the key METAL2 and takes its record"
      - "In that record, it finds the key number and takes its value, 6"
      - "puts prints 6"
    explanation: >
      Each key goes one level deeper, from the outside in: first the layer, then the field.

  - id: m10-w09-q14
    type: mcq
    lesson: a
    tags: [dictionary]
    review: false
    prompt: "What does a dict look like when you print it?"
    choices:
      - 'Like a list of pairs: key value key value'
      - 'Like a table with lines and columns'
      - 'Only its keys'
      - 'It cannot be printed'
    answer: 'Like a list of pairs: key value key value'
    explanation: >
      A dict is a value written like a list with an even number of elements. puts $gdsNumbers prints
      something like ACTIVE 1.0 POLY 2.0.
    distractor_feedback:
      'Like a table with lines and columns': 'You can print it as a table with dict for, but puts on its own prints the pairs on one line.'
      'Only its keys': 'That is dict keys. puts prints keys and values.'
      'It cannot be printed': 'A dict is a value like any other, so puts prints it.'

  # ---------- Lesson B ----------
  - id: m10-w09-q15
    type: mcq
    lesson: b
    tags: [array-order, array-names]
    review: true
    prompt: "After  array set count {METAL1 12 POLY 5 VIA1 7},  what can you say about the output of  puts [array names count] ?"
    choices:
      - 'It lists the three names, in an order that Tcl does not promise'
      - 'METAL1 POLY VIA1, the order they were given in'
      - 'METAL1 POLY VIA1, because the names are sorted'
      - 'METAL1 12 POLY 5 VIA1 7'
    answer: 'It lists the three names, in an order that Tcl does not promise'
    explanation: >
      array names gives every key, but the order is not promised and may differ between Tcl versions.
      Sort it with lsort [array names count] when the order matters.
    distractor_feedback:
      'METAL1 POLY VIA1, the order they were given in': 'That is what a dict would do. An array keeps no order.'
      'METAL1 POLY VIA1, because the names are sorted': 'array names does not sort. Write lsort [array names count] for that.'
      'METAL1 12 POLY 5 VIA1 7': 'That would be keys and values, like array get, and in no promised order either. array names gives only the keys.'

  - id: m10-w09-q16
    type: predict-output
    lesson: b
    tags: [array, incr, lsort]
    review: true
    prompt: "The names are sorted. What does this print?"
    code: |
      foreach layer {VIA1 POLY VIA1 METAL2 VIA1} {
          incr count($layer)
      }
      foreach layer [lsort [array names count]] {
          puts "$layer: $count($layer)"
      }
    answer: |-
      METAL2: 1
      POLY: 1
      VIA1: 3
    explanation: >
      incr starts each new element at 0 and adds 1. lsort puts the keys in alphabetical order, so the output
      is the same every time, whatever order array names gave.

  - id: m10-w09-q17
    type: mcq
    lesson: b
    tags: [dict-or-array, upvar]
    review: true
    prompt: "A proc must receive the layer table, add a layer, and give the table back. Which should the table be?"
    choices:
      - 'A dict: it is a value, so it can be passed in and returned'
      - 'An array: it is passed in with $table'
      - 'Either: they work the same way'
      - 'Neither: procs cannot change tables'
    answer: 'A dict: it is a value, so it can be passed in and returned'
    explanation: >
      A dict travels like a list: in as an argument, out with return. An array is a family of variables,
      not a value.
    distractor_feedback:
      'An array: it is passed in with $table': '$table is an error for an array: "variable is array". You would have to pass its name and use upvar.'
      'Either: they work the same way': 'Only a dict is a value. An array needs its name and upvar, and cannot be returned.'
      'Neither: procs cannot change tables': 'A proc can change its own copy of a dict and return it, or change a caller''s array through upvar.'

  - id: m10-w09-q18
    type: find-the-bug
    lesson: b
    tags: [array, error]
    review: true
    prompt: 'This stops with  can''t read "count": variable is array.  Which line has the bug?'
    code: |
      foreach layer {POLY POLY TEXT} {
          incr count($layer)
      }
      puts "POLY: $count(POLY)"
      puts $count
    answer: 5
    explanation: >
      An array is a family of variables, so $count alone means nothing. Read one element, like $count(POLY),
      or loop over lsort [array names count].

  - id: m10-w09-q19
