  - id: m10-exam-13
    type: choose-code
    week: 3
    tags: [quotes, braces, list]
    revisit: m10-w03-a
    prompt: "Which script prints exactly the target?"
    choices:
      - |
        set w 200
        puts "{CORE} $w"
      - |
        set w 200
        puts {{CORE} $w}
      - |
        set w 200
        puts [list CORE $w]
      - |
        set w 200
        puts "{CORE} \$w"
    target: "{CORE} 200"

  # ---------- Week 4 ----------
  - id: m10-exam-14
    type: predict-output
    week: 4
    tags: [if, elseif]
    revisit: m10-w04-a
    prompt: "What does this print?"
    code: |
      set width 3
      if {$width >= 4} {
          puts wide
      } elseif {$width == 3} {
          puts "just under"
      } else {
          puts narrow
      }
    output_hash: "8a7c83ec"

  - id: m10-exam-15
    type: predict-output
    week: 4
    tags: [for, incr]
    revisit: m10-w04-b
    prompt: "What does this print? Look at the last line closely."
    code: |
      set total 0
      for {set i 1} {$i <= 4} {incr i} {
          incr total $i
      }
      puts $total
      puts $i
    output_hash: "0d2608ac"

  - id: m10-exam-16
    type: complete-code
    week: 4
    tags: [while, incr]
    revisit: m10-w04-b
    prompt: "Type what goes in the blank, so that the loop prints the target."
    code: |
      set i 0
      while {$i < 6} {
          puts $i
          incr i ___
      }
    target: |-
      0
      2
      4

  # ---------- Week 5 ----------
  - id: m10-exam-17
    type: predict-output
    week: 5
    tags: [lindex, llength]
    revisit: m10-w05-a
    prompt: "A rectangle as a list. What does this print?"
    code: |
      set rect {20 200 140 280}
      puts [lindex $rect 2]
      puts [llength $rect]
      puts [lindex $rect end]
    output_hash: "985f3db1"

  - id: m10-exam-18
    type: choose-code
    week: 5
    tags: [foreach]
    revisit: m10-w05-b
    prompt: "Which script prints exactly the target?"
    choices:
      - |
        foreach {a b} {CORE SRAM ADC SENSOR} {
            puts "$a-$b"
        }
      - |
        foreach a {CORE SRAM ADC SENSOR} {
            puts "$a-$a"
        }
      - |
        foreach {a b} {CORE SRAM ADC SENSOR} {
            puts {$a-$b}
        }
      - |
        foreach a {CORE ADC} b {SRAM SENSOR} {
            puts "$a $b"
        }
    target: |-
      CORE-SRAM
      ADC-SENSOR

  # ---------- Week 6 ----------
  - id: m10-exam-19
    type: predict-output
    week: 6
    tags: [lsort]
    revisit: m10-w06-a
    prompt: "What does this print?"
    code: |
      set areas {9600 32000 8000}
      puts [lsort $areas]
      puts [lsort -integer $areas]
    output_hash: "8e832566"

  - id: m10-exam-20
    type: predict-output
