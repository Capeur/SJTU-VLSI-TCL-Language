# M10 milestone exam (PRD §9.1): 30 items, a fixed paper.
# Blueprint: predict-output 20/30 (>= 60 %), Week 3 10/30 (>= 1/3). Weeks: 1:1 2:2 3:10 4:3 5:2 6:3 7:3 8:2 9:2 10:2.
# NO ANSWERS HERE (user decision, P3 Week 10): every item is graded by running its code in the browser.
# The reference answers and explanations are in the private repository Capeur/SJTU-VLSI-TCL-Language-solutions
# (m10/exam/answers.yaml). Items are new: none repeats a public quiz-bank item, whose answer would be public.
# output_hash is written by `node scripts/check-exam.mjs --write-hashes` from real tclsh output; CI checks it on
# Tcl 8.6, 9.0 and Wacl. Avoid array order, long decimals and error texts that differ between Tcl versions.
ai_assisted: true
reviewed_by: "David"
review_date: "2026-10-16"
title: "M10 exam: Tcl Syntax Core"
items:
  # ---------- Week 1 ----------
  - id: m10-exam-01
    type: predict-output
    week: 1
    tags: [set, dollar]
    revisit: m10-w01-b
    prompt: "What does this print?"
    code: |
      set chip Lumen-1
      set chip SRAM
      puts $chip
      puts chip
    output_hash: "1ad526e5"

  # ---------- Week 2 ----------
  - id: m10-exam-02
    type: predict-output
    week: 2
    tags: [expr, integer-division]
    revisit: m10-w02-a
    prompt: "What does this print?"
    code: |
      puts [expr {7 / 2}]
      puts [expr {7 / 2.0}]
      puts [expr {7 % 2}]
    output_hash: "11f843f2"

  - id: m10-exam-03
    type: complete-code
    week: 2
    tags: [brackets, expr]
