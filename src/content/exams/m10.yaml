    tags: [split, join]
    revisit: m10-w06-b
    prompt: "What does this print?"
    code: |
      set text "POLY,METAL1,VIA1"
      set layers [split $text ,]
      puts [llength $layers]
      puts [join $layers " + "]
    output_hash: "c684b660"

  - id: m10-exam-21
    type: complete-code
    week: 6
    tags: [lsearch]
    revisit: m10-w06-a
    prompt: "Type the ONE command name that goes in the blank, so that the script prints the target."
    code: |
      set blocks {CORE SRAM ADC SENSOR PADS}
      puts [___ $blocks ADC]
    target: "2"

  # ---------- Week 7 ----------
  - id: m10-exam-22
    type: predict-output
    week: 7
    tags: [scope, global]
    revisit: m10-w07-b
    prompt: "A proc and a variable called total. What does this print?"
    code: |
      set total 0
      proc addBlock {area} {
          incr total $area
          return $total
      }
      puts [addBlock 800]
      puts $total
    output_hash: "215fe46a"

  - id: m10-exam-23
    type: predict-output
    week: 7
    tags: [proc, default-value, return]
    revisit: m10-w07-a
    prompt: "What does this print?"
    code: |
      proc margin {width {extra 2}} {
          if {$width < 0} {
              return "bad"
          }
          return [expr {$width + 2 * $extra}]
      }
      puts [margin 6]
      puts [margin 6 1]
      puts [margin -1]
    output_hash: "86887766"

  - id: m10-exam-24
    type: choose-code
    week: 7
    tags: [touching, proc]
    revisit: m10-w07-a
    prompt: "In this course, touching counts as a clash. Which proc follows that rule? Each script tests two spans that touch (0 to 10 and 10 to 20), then two with a 1 µm gap."
    choices:
      - |
        proc clash {a1 a2 b1 b2} {
            return [expr {$a1 <= $b2 && $b1 <= $a2}]
        }
        puts [clash 0 10 10 20]
        puts [clash 0 10 11 20]
      - |
        proc clash {a1 a2 b1 b2} {
            return [expr {$a1 < $b2 && $b1 < $a2}]
        }
        puts [clash 0 10 10 20]
        puts [clash 0 10 11 20]
      - |
        proc clash {a1 a2 b1 b2} {
            return [expr {$a1 <= $b2 || $b1 <= $a2}]
        }
        puts [clash 0 10 10 20]
        puts [clash 0 10 11 20]
      - |
        proc clash {a1 a2 b1 b2} {
            return [expr {$a1 <= $b1}]
        }
        puts [clash 0 10 10 20]
        puts [clash 0 10 11 20]
    target: |-
      1
      0

  # ---------- Week 8 ----------
  - id: m10-exam-25
    type: predict-output
    week: 8
    tags: [string-trim, toupper, string-match]
    revisit: m10-w08-a
    prompt: "Cleaning a typed name. What does this print?"
    code: |
      set raw "  via1_Pin "
      set name [string toupper [string trim $raw]]
      puts "|$name|"
      puts [string length $name]
      puts [string match {VIA?_*} $name]
    output_hash: "6b92b426"

  - id: m10-exam-26
    type: complete-code
    week: 8
    tags: [format]
    revisit: m10-w08-b
    prompt: "Type the format specifier that goes in the blank, so that the script prints the target (the | signs show the column edges)."
    code: |
      puts [format "%-5s|___|" ADC 9600]
    target: "ADC  |  9600|"

  # ---------- Week 9 ----------
  - id: m10-exam-27
    type: predict-output
    week: 9
    tags: [dict, order]
    revisit: m10-w09-a
    prompt: "What does this print?"
    code: |
      set gds [dict create POLY 2.0 VIA1 5.0]
      dict set gds ACTIVE 1.0
      dict set gds POLY 2.0
      puts [dict keys $gds]
      puts [dict get $gds VIA1]
    output_hash: "2ebcadde"

  - id: m10-exam-28
    type: choose-code
    week: 9
    tags: [array, lsort, dict]
    revisit: m10-w09-b
    prompt: "Which script prints exactly the target, every time, on any Tcl version?"
    choices:
      - |
        foreach layer {POLY METAL2 METAL2} {
            incr count($layer)
        }
        foreach layer [lsort [array names count]] {
            puts "$layer: $count($layer)"
        }
      - |
        foreach layer {POLY METAL2 METAL2} {
            incr count($layer)
        }
        puts "METAL2: $count(METAL2)"
        puts "POLY: $count(METAL2)"
      - |
        set count [dict create POLY 1 METAL2 2]
        dict for {layer n} $count {
            puts "$layer: $n"
        }
      - |
        set count [dict create METAL2 2 POLY 1]
        dict for {layer} $count {
            puts $layer
        }
    target: |-
      METAL2: 2
      POLY: 1

  # ---------- Week 10 ----------
  - id: m10-exam-29
    type: predict-output
    week: 10
    tags: [try, finally, error]
    revisit: m10-w10-b
    prompt: "try, on error and finally in a loop. What does this print?"
    code: |
      proc checkWidth {w} {
          if {$w <= 0} {
              error "width must be positive, got $w"
          }
          return ok
      }
      foreach w {5 0 3} {
          try {
              puts [checkWidth $w]
          } on error {message} {
              puts "skipped: $message"
          } finally {
              puts "checked $w"
          }
      }
    output_hash: "6d8550c2"

  - id: m10-exam-30
    type: complete-code
    week: 10
    tags: [catch]
    revisit: m10-w10-a
    prompt: "Type the ONE word that goes in the blank, so that the script prints the target."
    code: |
      if {[catch {puts $w} ___]} {
          puts "caught: $problem"
      }
    target: "caught: can't read \"w\": no such variable"
