  - id: m10-exam-10
    type: predict-output
    week: 3
    tags: [words, grouping, llength]
    revisit: m10-w03-a
    prompt: "How many words? What does this print?"
    code: |
      set blocks "CORE SRAM"
      puts [llength $blocks]
      puts [llength {$blocks}]
      puts [llength "$blocks ADC"]
