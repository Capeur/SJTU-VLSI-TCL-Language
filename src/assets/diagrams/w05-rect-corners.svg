<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330">
  <defs><marker id="w05-arrow2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="d-muted"/></marker></defs>
  <!-- chip corner region, 1.2 px per um; chip (0,0) at (40,290) -->
  <line class="d-arrow" x1="40" y1="290" x2="370" y2="290" marker-end="url(#w05-arrow2)"/>
  <line class="d-arrow" x1="40" y1="290" x2="40" y2="40" marker-end="url(#w05-arrow2)"/>
  <text class="d-txt d-small" x="372" y="294">x</text>
  <text class="d-txt d-small" x="34" y="34" text-anchor="end">y</text>
  <text class="d-txt d-small" x="36" y="306" text-anchor="end">(0, 0)</text>

  <!-- CORE: x 20..220, y 20..180 -->
  <rect class="d-box-info" x="64" y="74" width="240" height="192" rx="2"/>
  <text class="d-txt d-bold" x="184" y="176" text-anchor="middle">CORE</text>
  <circle class="d-box-warn" cx="64" cy="266" r="6"/>
  <text class="d-txt d-small d-fg-warn" x="74" y="284">(x1, y1) = (20, 20)</text>
  <circle class="d-box-warn" cx="304" cy="74" r="6"/>
  <text class="d-txt d-small d-fg-warn" x="200" y="62">(x2, y2) = (220, 180)</text>

  <line class="d-ink" x1="64" y1="104" x2="304" y2="104" marker-start="url(#w05-arrow2)" marker-end="url(#w05-arrow2)"/>
  <text class="d-txt d-small" x="184" y="124" text-anchor="middle">width = x2 − x1 = 200</text>
  <line class="d-ink" x1="274" y1="74" x2="274" y2="266" marker-start="url(#w05-arrow2)" marker-end="url(#w05-arrow2)"/>
  <text class="d-txt d-small" x="268" y="226" text-anchor="end">height = y2 − y1 = 160</text>

  <text class="d-txt d-bold" x="400" y="80">As a list</text>
  <text class="d-txt d-mono" x="400" y="108">{20 20 220 180}</text>
  <text class="d-txt d-small d-muted" x="400" y="140">index 0: x1 = 20</text>
  <text class="d-txt d-small d-muted" x="400" y="160">index 1: y1 = 20</text>
  <text class="d-txt d-small d-muted" x="400" y="180">index 2: x2 = 220</text>
  <text class="d-txt d-small d-muted" x="400" y="200">index 3: y2 = 180</text>
  <text class="d-txt d-small" x="400" y="236">One value holds the</text>
  <text class="d-txt d-small" x="400" y="254">whole rectangle.</text>
</svg>
