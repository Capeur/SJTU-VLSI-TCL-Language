<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262">
  <defs><marker id="w02-arrow3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="d-muted"/></marker></defs>
  <text class="d-txt d-bold" x="10" y="22">1. Tcl meets [ and runs what is inside, as a new command</text>
  <rect class="d-box-code" x="10" y="34" width="330" height="42" rx="6"/>
  <text class="d-txt d-mono" x="22" y="61">set area</text>
  <rect class="d-box-warn" x="98" y="40" width="226" height="30" rx="4"/>
  <text class="d-txt d-mono" x="108" y="61">[expr {400 * 300}]</text>
  <line class="d-arrow" x1="211" y1="78" x2="211" y2="102" marker-end="url(#w02-arrow3)"/>

  <text class="d-txt d-bold" x="10" y="124">2. That command runs and gives back its result</text>
  <rect class="d-box-code" x="10" y="136" width="330" height="42" rx="6"/>
  <text class="d-txt d-mono" x="22" y="163">expr {400 * 300}   gives   120000</text>
  <line class="d-arrow" x1="211" y1="180" x2="211" y2="204" marker-end="url(#w02-arrow3)"/>

  <text class="d-txt d-bold" x="10" y="226">3. The result takes the place of the brackets. Now set runs:</text>
  <text class="d-txt d-mono d-fg-ok" x="22" y="252">set area 120000</text>

  <rect class="d-box-info" x="370" y="96" width="260" height="96" rx="6"/>
  <text class="d-txt d-small" x="384" y="122">set never sees the brackets or</text>
  <text class="d-txt d-small" x="384" y="142">the maths. By the time set runs,</text>
  <text class="d-txt d-small" x="384" y="162">its second word is already the</text>
  <text class="d-txt d-small" x="384" y="182">number 120000.</text>
</svg>
