<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <!-- 2 px per um. CORE x 20..220, y 20..180 -> svg x = 40 + 2*(x-20), y = 360 - 2*(y-20) -->
  <rect class="d-chip" x="40" y="40" width="400" height="320"/>
  <text class="d-txt d-small d-muted" x="44" y="56">CORE</text>
  <!-- ALU 30 30 90 80 -->
  <rect class="d-box-info" x="60" y="240" width="120" height="100"/>
  <text class="d-txt d-mono d-small" x="120" y="294" text-anchor="middle">ALU</text>
  <!-- REGS 90 30 140 80 -->
  <rect class="d-box-info" x="180" y="240" width="100" height="100"/>
  <text class="d-txt d-mono d-small" x="230" y="294" text-anchor="middle">REGS</text>
  <!-- CTRL 141 30 200 79 -->
  <rect class="d-box-ok" x="286" y="246" width="114" height="94"/>
  <text class="d-txt d-mono d-small" x="341" y="294" text-anchor="middle">CTRL</text>
  <!-- CACHE 140 80 200 170 -->
  <rect class="d-box-info" x="280" y="60" width="120" height="180"/>
  <text class="d-txt d-mono d-small" x="350" y="150" text-anchor="middle">CACHE</text>
  <!-- FPU 30 90 145 170 -->
  <rect class="d-box-warn" x="60" y="60" width="230" height="160" fill-opacity="0.75"/>
  <text class="d-txt d-mono d-small" x="160" y="144" text-anchor="middle">FPU</text>

  <!-- markers -->
  <circle class="d-box-bad" cx="180" cy="250" r="7"/>
  <text class="d-txt d-small d-bold d-fg-bad" x="180" y="254" text-anchor="middle">1</text>
  <circle class="d-box-bad" cx="280" cy="240" r="7"/>
  <text class="d-txt d-small d-bold d-fg-bad" x="280" y="244" text-anchor="middle">2</text>
  <circle class="d-box-bad" cx="285" cy="140" r="7"/>
  <text class="d-txt d-small d-bold d-fg-bad" x="285" y="144" text-anchor="middle">3</text>

  <text class="d-txt d-small d-bold" x="456" y="70">Conflicts</text>
  <text class="d-txt d-small d-fg-bad" x="456" y="94">1  ALU and REGS:</text>
  <text class="d-txt d-small" x="474" y="110">share the edge x = 90</text>
  <text class="d-txt d-small d-fg-bad" x="456" y="134">2  REGS and CACHE:</text>
  <text class="d-txt d-small" x="474" y="150">touch at the corner</text>
  <text class="d-txt d-small" x="474" y="166">(140, 80)</text>
  <text class="d-txt d-small d-fg-bad" x="456" y="190">3  CACHE and FPU:</text>
  <text class="d-txt d-small" x="474" y="206">overlap by 5 µm</text>
  <text class="d-txt d-small d-bold" x="456" y="240">No conflict</text>
  <text class="d-txt d-small d-fg-ok" x="456" y="264">REGS and CTRL: 1 µm gap</text>
  <text class="d-txt d-small d-fg-ok" x="456" y="284">CTRL and CACHE: 1 µm gap</text>
  <text class="d-txt d-small d-muted" x="456" y="314">Gaps of 1 µm are drawn</text>
  <text class="d-txt d-small d-muted" x="456" y="330">a little wider so you</text>
  <text class="d-txt d-small d-muted" x="456" y="346">can see them.</text>
</svg>
