<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250">
  <defs><marker id="w06-arrow1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="d-muted"/></marker></defs>
  <text class="d-txt d-mono" x="10" y="24">set layers {ACTIVE POLY CONTACT METAL1 VIA1 METAL2 TEXT}</text>

  <!-- lrange bracket over boxes 1..3 -->
  <path class="d-ink" d="M98 60 L98 52 L362 52 L362 60"/>
  <text class="d-txt d-small d-fg-ok" x="230" y="44" text-anchor="middle">lrange $layers 1 3  →  POLY CONTACT METAL1 (both ends included)</text>

  <rect class="d-box-code" x="10" y="64" width="84" height="40" rx="6"/>
  <text class="d-txt d-mono d-small" x="52" y="89" text-anchor="middle">ACTIVE</text>
  <rect class="d-box-ok" x="98" y="64" width="84" height="40" rx="6"/>
  <text class="d-txt d-mono d-small" x="140" y="89" text-anchor="middle">POLY</text>
  <rect class="d-box-ok" x="186" y="64" width="84" height="40" rx="6"/>
  <text class="d-txt d-mono d-small" x="228" y="89" text-anchor="middle">CONTACT</text>
  <rect class="d-box-ok" x="274" y="64" width="88" height="40" rx="6"/>
  <text class="d-txt d-mono d-small" x="318" y="89" text-anchor="middle">METAL1</text>
  <rect class="d-box-code" x="366" y="64" width="80" height="40" rx="6"/>
  <text class="d-txt d-mono d-small" x="406" y="89" text-anchor="middle">VIA1</text>
  <rect class="d-box-code" x="450" y="64" width="88" height="40" rx="6"/>
  <text class="d-txt d-mono d-small" x="494" y="89" text-anchor="middle">METAL2</text>
  <rect class="d-box-code" x="542" y="64" width="84" height="40" rx="6"/>
  <text class="d-txt d-mono d-small" x="584" y="89" text-anchor="middle">TEXT</text>

  <text class="d-txt d-small d-muted" x="52" y="124" text-anchor="middle">0</text>
  <text class="d-txt d-small d-muted" x="140" y="124" text-anchor="middle">1</text>
  <text class="d-txt d-small d-muted" x="228" y="124" text-anchor="middle">2</text>
  <text class="d-txt d-small d-bold" x="318" y="124" text-anchor="middle">3</text>
  <text class="d-txt d-small d-muted" x="406" y="124" text-anchor="middle">4</text>
  <text class="d-txt d-small d-muted" x="494" y="124" text-anchor="middle">5</text>
  <text class="d-txt d-small d-muted" x="584" y="124" text-anchor="middle">6 = end</text>

  <!-- lsearch METAL1 -->
  <rect class="d-box-info" x="230" y="170" width="176" height="34" rx="6"/>
  <text class="d-txt d-mono d-small" x="318" y="192" text-anchor="middle">lsearch $layers METAL1</text>
  <line class="d-arrow" x1="318" y1="170" x2="318" y2="132" marker-end="url(#w06-arrow1)"/>
  <text class="d-txt d-small" x="318" y="224" text-anchor="middle">gives 3: the index where it is</text>

  <rect class="d-box-bad" x="440" y="170" width="186" height="34" rx="6"/>
  <text class="d-txt d-mono d-small" x="533" y="192" text-anchor="middle">lsearch $layers METAL3</text>
  <text class="d-txt d-small d-fg-bad" x="533" y="224" text-anchor="middle">gives -1: not in the list</text>
  <text class="d-txt d-small d-muted" x="10" y="192">Both commands only</text>
  <text class="d-txt d-small d-muted" x="10" y="210">read the list.</text>
</svg>
