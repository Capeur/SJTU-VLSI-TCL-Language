<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230">
  <!-- 12 px per um; every cell is 10 um tall (120 px); baseline y = 170 -->
  <text class="d-txt d-small d-muted" x="10" y="22">The five starter cells side by side, to scale. Same height (10 µm), different widths.</text>
  <line class="d-ink" x1="10" y1="170" x2="630" y2="170"/>
  <rect class="d-box-info" x="16" y="50" width="36" height="120"/>
  <text class="d-txt d-mono d-small" x="34" y="190" text-anchor="middle">INV</text>
  <text class="d-txt d-small d-muted" x="34" y="208" text-anchor="middle">3 wide</text>
  <rect class="d-box-info" x="64" y="50" width="60" height="120"/>
  <text class="d-txt d-mono d-small" x="94" y="190" text-anchor="middle">NAND2</text>
  <text class="d-txt d-small d-muted" x="94" y="208" text-anchor="middle">5 wide</text>
  <rect class="d-box-ok" x="136" y="50" width="168" height="120"/>
  <text class="d-txt d-mono d-small" x="220" y="190" text-anchor="middle">DFF</text>
  <text class="d-txt d-small d-muted" x="220" y="208" text-anchor="middle">14 wide: the largest</text>
  <rect class="d-box-info" x="316" y="50" width="72" height="120"/>
  <text class="d-txt d-mono d-small" x="352" y="190" text-anchor="middle">NOR2</text>
  <text class="d-txt d-small d-muted" x="352" y="208" text-anchor="middle">6 wide</text>
  <rect class="d-box-info" x="400" y="50" width="48" height="120"/>
  <text class="d-txt d-mono d-small" x="424" y="190" text-anchor="middle">BUF</text>
  <text class="d-txt d-small d-muted" x="424" y="208" text-anchor="middle">4 wide</text>
  <text class="d-txt d-small" x="470" y="70">Each cell is drawn</text>
  <text class="d-txt d-small" x="470" y="88">from its own corner</text>
  <text class="d-txt d-mono d-small" x="470" y="106">0, 0</text>
  <text class="d-txt d-small" x="470" y="134">area = width</text>
  <text class="d-txt d-small" x="470" y="152">× height</text>
</svg>
