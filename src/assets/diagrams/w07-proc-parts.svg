<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290">
  <defs><marker id="w07-arrow1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="d-muted"/></marker></defs>
  <text class="d-txt d-bold" x="20" y="24">Define it once</text>
  <rect class="d-box-code" x="20" y="34" width="600" height="72" rx="6"/>
  <text class="d-txt d-mono" x="34" y="60">proc <tspan class="d-bold d-fg-info">rectWidth</tspan> <tspan class="d-bold d-fg-ok">{rect}</tspan> <tspan class="d-fg-warn">{</tspan></text>
  <text class="d-txt d-mono d-fg-warn" x="66" y="80">return [expr {[lindex $rect 2] - [lindex $rect 0]}]</text>
  <text class="d-txt d-mono d-fg-warn" x="34" y="98">}</text>
  <text class="d-txt d-small d-fg-info" x="120" y="124">name</text>
  <text class="d-txt d-small d-fg-ok" x="212" y="124">arguments</text>
  <text class="d-txt d-small d-fg-warn" x="330" y="124">body: runs only when called</text>

  <text class="d-txt d-bold" x="20" y="162">Call it as often as you like</text>
  <rect class="d-box-info" x="20" y="172" width="330" height="40" rx="6"/>
  <text class="d-txt d-mono" x="34" y="198">puts [rectWidth {20 20 220 180}]</text>
  <line class="d-arrow" x1="240" y1="214" x2="240" y2="246" marker-end="url(#w07-arrow1)"/>
  <text class="d-txt d-small" x="252" y="236">rect = 20 20 220 180</text>
  <rect class="d-box-warn" x="160" y="250" width="200" height="30" rx="6"/>
  <text class="d-txt d-small" x="260" y="270" text-anchor="middle">body runs: 220 - 20</text>
  <line class="d-arrow" x1="364" y1="265" x2="420" y2="200" marker-end="url(#w07-arrow1)"/>
  <rect class="d-box-ok" x="424" y="172" width="196" height="40" rx="6"/>
  <text class="d-txt d-small" x="522" y="190" text-anchor="middle">return sends back 200,</text>
  <text class="d-txt d-small" x="522" y="206" text-anchor="middle">which replaces the call</text>
</svg>
