<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300">
  <!-- The 20 um channel between CORE and SRAM, at 22 px per um: x = 0 at px 100, x = 20 at px 540 -->
  <defs>
    <pattern id="w04-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" class="d-arrow"/></pattern>
  </defs>
  <rect class="d-box-info" x="10" y="40" width="90" height="190" rx="3"/>
  <text class="d-txt d-bold" x="55" y="140" text-anchor="middle">CORE</text>
  <rect class="d-box-info" x="540" y="40" width="90" height="190" rx="3"/>
  <text class="d-txt d-bold" x="585" y="140" text-anchor="middle">SRAM</text>
  <text class="d-txt d-small d-muted" x="320" y="24" text-anchor="middle">The channel between CORE and SRAM, seen from above (example inputs)</text>

  <!-- tracks: x = 2, 7, 12; width 3 -->
  <rect class="d-box-ok" x="144" y="40" width="66" height="190"/>
  <text class="d-txt d-small d-bold" x="177" y="140" text-anchor="middle">1</text>
  <rect class="d-box-ok" x="254" y="40" width="66" height="190"/>
  <text class="d-txt d-small d-bold" x="287" y="140" text-anchor="middle">2</text>
  <rect class="d-box-ok" x="364" y="40" width="66" height="190"/>
  <text class="d-txt d-small d-bold" x="397" y="140" text-anchor="middle">3</text>
  <!-- left over: 17 to 20 -->
  <rect x="474" y="40" width="66" height="190" fill="url(#w04-hatch)"/>

  <!-- dimensions -->
  <line class="d-ink" x1="100" y1="244" x2="100" y2="262"/>
  <line class="d-ink" x1="144" y1="244" x2="144" y2="262"/>
  <line class="d-ink" x1="210" y1="244" x2="210" y2="262"/>
  <line class="d-ink" x1="254" y1="244" x2="254" y2="262"/>
  <line class="d-ink" x1="540" y1="244" x2="540" y2="262"/>
  <text class="d-txt d-small" x="122" y="258" text-anchor="middle">2</text>
  <text class="d-txt d-small" x="177" y="258" text-anchor="middle">3</text>
  <text class="d-txt d-small" x="232" y="258" text-anchor="middle">2</text>
  <text class="d-txt d-small" x="100" y="296" text-anchor="middle">x = 0 (CORE's edge)</text>
  <text class="d-txt d-small" x="144" y="280" text-anchor="middle">x = 2</text>
  <text class="d-txt d-small" x="254" y="280" text-anchor="middle">x = 7</text>
  <text class="d-txt d-small" x="364" y="280" text-anchor="middle">x = 12</text>
  <line class="d-ink" x1="364" y1="244" x2="364" y2="262"/>
  <text class="d-txt d-small" x="540" y="280" text-anchor="middle">x = 20</text>
  <text class="d-txt d-small d-muted" x="507" y="258" text-anchor="middle">too small</text>
</svg>
