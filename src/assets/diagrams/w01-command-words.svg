<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270">
  <text class="d-txt d-mono" x="10" y="24">set chipWidth 400</text>
  <rect class="d-box-info" x="10" y="38" width="70" height="36" rx="5"/>
  <text class="d-txt d-mono" x="45" y="61" text-anchor="middle">set</text>
  <rect class="d-box-ok" x="92" y="38" width="120" height="36" rx="5"/>
  <text class="d-txt d-mono" x="152" y="61" text-anchor="middle">chipWidth</text>
  <rect class="d-box-ok" x="224" y="38" width="64" height="36" rx="5"/>
  <text class="d-txt d-mono" x="256" y="61" text-anchor="middle">400</text>
  <text class="d-txt d-small d-fg-info" x="45" y="94" text-anchor="middle">command</text>
  <text class="d-txt d-small d-fg-info" x="45" y="110" text-anchor="middle">name</text>
  <text class="d-txt d-small d-fg-ok" x="152" y="94" text-anchor="middle">argument 1</text>
  <text class="d-txt d-small d-fg-ok" x="256" y="94" text-anchor="middle">argument 2</text>
  <text class="d-txt d-small" x="310" y="54">3 words. The first word says what</text>
  <text class="d-txt d-small" x="310" y="74">to do; the others say what to do it with.</text>

  <text class="d-txt d-mono" x="10" y="148">puts "Size: 400 x 300 um"</text>
  <rect class="d-box-info" x="10" y="160" width="70" height="36" rx="5"/>
  <text class="d-txt d-mono" x="45" y="183" text-anchor="middle">puts</text>
  <rect class="d-box-ok" x="92" y="160" width="196" height="36" rx="5"/>
  <text class="d-txt d-mono" x="190" y="183" text-anchor="middle">Size: 400 x 300 um</text>
  <text class="d-txt d-small d-fg-info" x="45" y="216" text-anchor="middle">command</text>
  <text class="d-txt d-small d-fg-info" x="45" y="232" text-anchor="middle">name</text>
  <text class="d-txt d-small d-fg-ok" x="190" y="216" text-anchor="middle">argument 1</text>
  <text class="d-txt d-small" x="310" y="176">2 words. The double quotes keep the</text>
  <text class="d-txt d-small" x="310" y="196">text together as one word, spaces and all.</text>
  <text class="d-txt d-small d-muted" x="10" y="262">The quote marks are not part of the word: puts never prints them.</text>
</svg>
