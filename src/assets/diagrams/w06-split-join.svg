<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260">
  <defs><marker id="w06-arrow4" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="d-muted"/></marker></defs>
  <text class="d-txt d-small d-muted" x="20" y="24">text: one piece</text>
  <rect class="d-box-code" x="20" y="32" width="300" height="36" rx="4"/>
  <text class="d-txt d-mono" x="34" y="56">ACTIVE<tspan class="d-bold d-fg-warn">,</tspan>POLY<tspan class="d-bold d-fg-warn">,</tspan>CONTACT</text>

  <line class="d-arrow" x1="170" y1="72" x2="170" y2="104" marker-end="url(#w06-arrow4)"/>
  <text class="d-txt d-mono d-small" x="186" y="94">split $text ,</text>
  <text class="d-txt d-small d-muted" x="300" y="94">cut at every comma</text>

  <text class="d-txt d-small d-muted" x="20" y="124">list: three elements</text>
  <rect class="d-box-ok" x="20" y="132" width="110" height="36" rx="6"/>
  <text class="d-txt d-mono" x="75" y="156" text-anchor="middle">ACTIVE</text>
  <rect class="d-box-ok" x="140" y="132" width="90" height="36" rx="6"/>
  <text class="d-txt d-mono" x="185" y="156" text-anchor="middle">POLY</text>
  <rect class="d-box-ok" x="240" y="132" width="120" height="36" rx="6"/>
  <text class="d-txt d-mono" x="300" y="156" text-anchor="middle">CONTACT</text>

  <line class="d-arrow" x1="170" y1="172" x2="170" y2="204" marker-end="url(#w06-arrow4)"/>
  <text class="d-txt d-mono d-small" x="186" y="194">join $layers ", "</text>
  <text class="d-txt d-small d-muted" x="340" y="194">glue with comma and space</text>

  <rect class="d-box-code" x="20" y="212" width="340" height="36" rx="4"/>
  <text class="d-txt d-mono" x="34" y="236">ACTIVE<tspan class="d-bold d-fg-info">, </tspan>POLY<tspan class="d-bold d-fg-info">, </tspan>CONTACT</text>
  <text class="d-txt d-small" x="400" y="140">split: text → list</text>
  <text class="d-txt d-small" x="400" y="232">join: list → text</text>
</svg>
