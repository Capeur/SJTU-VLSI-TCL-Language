<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs><marker id="w03-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="d-muted"/></marker></defs>
  <g>
    <rect class="d-box-info" x="10" y="10" width="620" height="56" rx="7"/>
    <text class="d-txt d-bold" x="26" y="34">1. Find where the command ends</text>
    <text class="d-txt d-small" x="26" y="54">at a new line or a semicolon ;  (a # where a command starts begins a comment)</text>
    <text class="d-txt d-small d-muted" x="620" y="34" text-anchor="end">rules 1, 10</text>
  </g>
  <line class="d-arrow" x1="320" y1="66" x2="320" y2="82" marker-end="url(#w03-arrow)"/>
  <g>
    <rect class="d-box-info" x="10" y="86" width="620" height="56" rx="7"/>
    <text class="d-txt d-bold" x="26" y="110">2. Cut it into words at the spaces</text>
    <text class="d-txt d-small" x="26" y="130">"…" and {…} keep a word together</text>
    <text class="d-txt d-small d-muted" x="620" y="110" text-anchor="end">rules 3, 4, 6</text>
  </g>
  <line class="d-arrow" x1="320" y1="142" x2="320" y2="158" marker-end="url(#w03-arrow)"/>
  <g>
    <rect class="d-box-warn" x="10" y="162" width="620" height="74" rx="7"/>
    <text class="d-txt d-bold" x="26" y="186">3. Substitute $name, [command] and \ in each word</text>
    <text class="d-txt d-small" x="26" y="206">left to right, exactly once. Nothing inside {…} changes.</text>
    <text class="d-txt d-small" x="26" y="225">A value that comes in is never read again, and never splits a word.</text>
    <text class="d-txt d-small d-muted" x="620" y="186" text-anchor="end">rules 7, 8, 9, 11, 12</text>
  </g>
  <line class="d-arrow" x1="320" y1="236" x2="320" y2="252" marker-end="url(#w03-arrow)"/>
  <g>
    <rect class="d-box-info" x="10" y="256" width="620" height="56" rx="7"/>
    <text class="d-txt d-bold" x="26" y="280">4. The first word names the command</text>
    <text class="d-txt d-small" x="26" y="300">puts, set, expr … every one is found the same way</text>
    <text class="d-txt d-small d-muted" x="620" y="280" text-anchor="end">rule 2</text>
  </g>
  <line class="d-arrow" x1="320" y1="312" x2="320" y2="328" marker-end="url(#w03-arrow)"/>
  <g>
    <rect class="d-box-ok" x="10" y="332" width="620" height="56" rx="7"/>
    <text class="d-txt d-bold" x="26" y="356">5. Run the command with the other words</text>
    <text class="d-txt d-small" x="26" y="376">The command decides what its words mean (expr reads them as maths)</text>
    <text class="d-txt d-small d-muted" x="620" y="356" text-anchor="end">rule 2</text>
  </g>
</svg>
