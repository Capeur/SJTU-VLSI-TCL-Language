<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250">
  <text class="d-txt d-mono" x="10" y="24">foreach {name width height} $blockSizes {…}</text>
  <text class="d-txt d-small d-muted" x="10" y="46">Three loop variables: each pass takes the next three elements.</text>

  <rect class="d-box-info" x="10" y="64" width="190" height="40" rx="6"/>
  <text class="d-txt d-mono" x="105" y="89" text-anchor="middle">CORE 200 160</text>
  <rect class="d-box-ok" x="210" y="64" width="190" height="40" rx="6"/>
  <text class="d-txt d-mono" x="305" y="89" text-anchor="middle">SRAM 140 160</text>
  <rect class="d-box-warn" x="410" y="64" width="160" height="40" rx="6"/>
  <text class="d-txt d-mono" x="490" y="89" text-anchor="middle">ADC 120 80</text>
  <text class="d-txt d-bold" x="580" y="89">…</text>

  <text class="d-txt d-bold" x="10" y="140">pass 1</text>
  <text class="d-txt d-mono d-small" x="80" y="140">name=CORE   width=200   height=160</text>
  <text class="d-txt d-bold" x="10" y="166">pass 2</text>
  <text class="d-txt d-mono d-small" x="80" y="166">name=SRAM   width=140   height=160</text>
  <text class="d-txt d-bold" x="10" y="192">pass 3</text>
  <text class="d-txt d-mono d-small" x="80" y="192">name=ADC    width=120   height=80</text>
  <text class="d-txt d-small d-muted" x="10" y="232">15 elements, 3 per pass: 5 passes, one per block.</text>
</svg>
